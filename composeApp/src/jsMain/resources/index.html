<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YkisMobKMP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link type="text/css" rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
</head>
<body style="text-align: center; align-content: center">
<div id="recaptcha-container" style="position: fixed; bottom: 0; left: 0; z-index: 9999;"></div>

<!-- Firebase SDKs (compat) потрібні лише для AppCheck та SMS, якщо Kotlin-обгортка їх викликає через вікно -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>

<script>
    // Ми НЕ викликаємо initializeApp тут, це зробить Kotlin (Koin.js.kt)

    window.initializeFirebaseAppCheck = function(siteKey) {
        try {
            // App Check ініціалізується автоматично після ініціалізації додатку в Kotlin
            const provider = new firebase.appCheck.ReCaptchaV3Provider(siteKey);
            firebase.appCheck().activate(provider, true);
            console.log("[JS] reCAPTCHA V3 activated via bridge");
        } catch (e) {
            console.error("[JS] App Check activation fail:", e.message);
        }
    };

    // --- Google Auth Bridge (Оптимізовано для Safari та Chrome) ---
    window.triggerGoogleAuth = function(clientId) {
        console.log("[JS] Google Auth Requested...");
        try {
            google.accounts.id.initialize({
                client_id: clientId,
                ux_mode: 'popup',
                itp_support: true,
                auto_select: false,
                use_fedcm_for_prompt: false,
                callback: (response) => {
                    if (response.credential && window.onGoogleTokenReceived) {
                        window.onGoogleTokenReceived(response.credential);
                    }
                }
            });

            // ПРИМУСОВИЙ ВИКЛИК ПАП-АПУ
            google.accounts.id.prompt((notification) => {
                console.log("[JS] GSI Status:", notification.getMomentType());
                if (notification.isSkippedMoment()) {
                    console.warn("[JS] One Tap skipped, reason:", notification.getSkippedReason());
                    // Якщо шторка зверху заблокована - нічого не робимо,
                    // користувачу доведеться клікнути ще раз або ми виведемо кнопку
                }
            });
        } catch (e) {
            console.error("[JS] GSI Error:", e);
        }
    };

    // --- SMS AUTH ---
    let confirmationResult = null;
    window.sendSmsWeb = async function(phoneNumber) {
        try {
            const auth = firebase.auth();
            const verifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', { 'size': 'invisible' });
            confirmationResult = await auth.signInWithPhoneNumber(phoneNumber, verifier);
            return "SUCCESS";
        } catch (e) { throw e.message; }
    };
    window.verifySmsWeb = async function(smsCode) {
        if (!confirmationResult) throw "Session expired";
        try { await confirmationResult.confirm(smsCode); return true; } catch (e) { throw "Invalid code"; }
    };

    // --- WEB PUSH ---
    window.getWebFcmToken = async function(vapidKey) {
        try {
            if (Notification.permission === 'default') await Notification.requestPermission();
            if (!('serviceWorker' in navigator)) return null;
            const registration = await navigator.serviceWorker.register('/firebase-messaging-sw.js');
            return await firebase.messaging().getToken({ vapidKey: vapidKey, serviceWorkerRegistration: registration });
        } catch (e) { return null; }
    };
</script>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 50 50">
    <circle cx="25" cy="25" r="20" stroke="#ccc" stroke-width="4" fill="none"/>
    <circle cx="25" cy="25" r="20" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="90 125">
        <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s" repeatCount="indefinite"/>
    </circle>
</svg>
<script type="module" src="composeApp.js"></script>
</body>
</html>
