<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YkisMobKMP v2.2.2</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #f0f2f5; }
        #google-auth-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2147483647; background: rgba(0,0,0,0.75);
            justify-content: center; align-items: center;
        }
        .auth-card {
            background: white; padding: 40px; border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); text-align: center;
            min-width: 320px; border: 2px solid #1a73e8;
        }
    </style>
</head>
<body style="text-align: center; align-content: center">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyD5ukrhK6g6xKlrn4Iv9zPQxB7ji_gACY4",
        authDomain: "ykis-mob.firebaseapp.com",
        projectId: "ykis-mob",
        appId: "1:1062920014188:web:cd8ced095f943b9d088b49"
    };

    if (firebase.apps.length === 0) { firebase.initializeApp(firebaseConfig); }
    console.log("[JS] INDEX.HTML VERSION: 2.2.2 (MODAL_FORCED)");

    window.triggerGoogleAuth = function(clientId) {
        console.log("[JS] triggerGoogleAuth v2.2.2 START");

        // Визначаємо браузер
        const isChrome = /Chrome/.test(navigator.userAgent) && /Google Inc/.test(navigator.vendor);

        try {
            google.accounts.id.initialize({
                client_id: clientId,
                ux_mode: 'popup',
                auto_select: false,
                use_fedcm_for_prompt: true,
                callback: (response) => {
                    console.log("[JS] Token success!");
                    document.getElementById('google-auth-overlay').style.display = 'none';
                    if (response.credential && window.onGoogleTokenReceived) {
                        window.onGoogleTokenReceived(response.credential);
                    }
                }
            });

            google.accounts.id.renderButton(
                document.getElementById("google-signin-btn"),
                { theme: "filled_blue", size: "large", width: 280, shape: "pill" }
            );

            // Якщо це НЕ Chrome — показуємо модальне вікно ВІДРАЗУ,
            // бо автоматична шторка часто невидима в Firefox/Safari
            if (!isChrome) {
                console.log("[JS] Non-Chrome browser detected. Showing modal immediately.");
                document.getElementById('google-auth-overlay').style.display = 'flex';
            }

            // Запускаємо автоматичне вікно
            google.accounts.id.prompt((notification) => {
                console.log("[JS] Prompt Moment:", notification.getMomentType());

                // Для Chrome: якщо автоматичне вікно НЕ показалося
                if (isChrome && (notification.isNotDisplayed() || notification.isSkippedMoment())) {
                    document.getElementById('google-auth-overlay').style.display = 'flex';
                }
            });
        } catch (e) {
            console.error("[JS] GSI Error:", e);
        }
    };

    window.initializeFirebaseAppCheck = (key) => {};
    window.sendSmsWeb = async () => "SUCCESS";
    window.verifySmsWeb = async () => true;
    window.getWebFcmToken = async () => null;
</script>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script type="module" src="composeApp.js"></script>

<div id="google-auth-overlay">
    <div class="auth-card">
        <p style="font-family: sans-serif; font-size: 22px; font-weight: bold; color: #1a73e8; margin-bottom: 12px;">ЮКІС Авторизація</p>
        <p style="font-family: sans-serif; font-size: 15px; color: #5f6368; margin-bottom: 30px;">Будь ласка, натисніть кнопку нижче:</p>
        <div id="google-signin-btn" style="display: flex; justify-content: center; min-height: 50px;"></div>
        <hr style="border: 0; border-top: 1px solid #eee; margin: 30px 0;">
        <button onclick="document.getElementById('google-auth-overlay').style.display='none'" style="background: #f1f3f4; border: none; padding: 12px 30px; border-radius: 8px; color: #3c4043; cursor: pointer; font-weight: bold;">Скасувати</button>
    </div>
</div>

</body>
</html>
