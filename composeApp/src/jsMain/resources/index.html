<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЮКІС Южне</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link type="text/css" rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <!-- reCAPTCHA Enterprise Script -->
    <script src="https://www.google.com/recaptcha/enterprise.js?render=6Le1KyctAAAAAKfaFArw96fKZev9yAxMeqEFagrh"></script>
</head>
<body style="text-align: center; align-content: center">

<div id="recaptcha-container"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>

<script>
    // Еталонна конфігурація з консолі Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyD5ukrhK6g6xKlrn4Iv9zPQxB7ji_gACY4",
      authDomain: "ykis-mob.firebaseapp.com",
      databaseURL: "https://ykis-mob-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "ykis-mob",
      storageBucket: "ykis-mob.firebasestorage.app",
      messagingSenderId: "1062920014188",
      appId: "1:1062920014188:web:cd8ced095f943b9d088b49",
      measurementId: "G-JNPZSDLKV9"
    };

    if (firebase.apps.length === 0) {
        firebase.initializeApp(firebaseConfig);
    }

    let confirmationResult = null;
    let recaptchaVerifier = null;

    window.initializeFirebaseAppCheck = function(siteKey) {
        try {
            firebase.appCheck().activate(siteKey, true);
            console.log("[JS] App Check Ready");
        } catch (e) { }
    };

    window.sendSmsWeb = async function(phoneNumber) {
        console.log("[JS] SMS Request:", phoneNumber);
        const auth = firebase.auth();
        auth.languageCode = 'uk';
        try {
            if (recaptchaVerifier) { try { recaptchaVerifier.clear(); } catch(e) {} }
            recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', { 'size': 'invisible' });
            confirmationResult = await auth.signInWithPhoneNumber(phoneNumber, recaptchaVerifier);
            return "SUCCESS";
        } catch (e) { throw e.message; }
    };

    window.verifySmsWeb = async function(smsCode) {
        if (!confirmationResult) throw "Сесія не знайдена";
        try { await confirmationResult.confirm(smsCode); return true; } catch (e) { throw "Невірний код"; }
    };

    window.getWebFcmToken = async function(vapidKey) {
        try {
            const registration = await navigator.serviceWorker.register('/firebase-messaging-sw.js');
            const messaging = firebase.messaging();
            return await messaging.getToken({ vapidKey: vapidKey, serviceWorkerRegistration: registration });
        } catch (e) { return null; }
    };

    window.triggerGoogleAuth = function(clientId) {
        google.accounts.id.initialize({
            client_id: clientId,
            ux_mode: 'popup',
            callback: (response) => {
                if (response.credential && window.onGoogleTokenReceived) {
                    window.onGoogleTokenReceived(response.credential);
                }
            }
        });
        google.accounts.id.prompt();
    };
</script>

<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 50 50">
    <circle cx="25" cy="25" r="20" stroke="#ccc" stroke-width="4" fill="none"/>
    <circle cx="25" cy="25" r="20" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="90 125">
        <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s" repeatCount="indefinite"/>
    </circle>
</svg>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script type="module" src="composeApp.js"></script>
</body>
</html>
