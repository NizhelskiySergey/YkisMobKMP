<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>ЮКІС (1.3.3)</title>
    <script>
        (function() {
            try {
                let raw = localStorage.getItem('app_language') || 'uk';
                let lang = raw.replace(/['"]+/g, '').trim();
                document.documentElement.lang = lang;
                document.documentElement.setAttribute('lang', lang);
                const languageProp = { get: function() { return lang; } };
                const languagesProp = { get: function() { return [lang, (lang === 'uk' ? 'ru' : 'uk')]; } };
                try {
                    Object.defineProperty(navigator, 'language', languageProp);
                    Object.defineProperty(navigator, 'languages', languagesProp);
                } catch (e) {
                    navigator.__proto__.language = lang;
                }
            } catch (e) { console.error("[JS] Spoofing error:", e); }
        })();
    </script>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #f0f2f5; }
        #google-auth-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2147483647; background: rgba(0,0,0,0.75);
            justify-content: center; align-items: center;
        }
        .auth-card {
            background: white; padding: 40px; border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); text-align: center;
            min-width: 320px; border: 2px solid #1a73e8;
        }
        #recaptcha-container { position: fixed; bottom: 0; right: 0; z-index: 9999; }
    </style>
</head>
<body style="text-align: center; align-content: center">

<div id="recaptcha-container"></div>

<!-- FIREBASE SDK COMPAT (JS) -->
<script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-app-check-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyD5ukrhK6g6xKlrn4Iv9zPQxB7ji_gACY4",
        authDomain: "ykis-mob.firebaseapp.com",
        databaseURL: "https://ykis-mob-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "ykis-mob",
        storageBucket: "ykis-mob.firebasestorage.app",
        messagingSenderId: "1062920014188",
        appId: "1:1062920014188:web:cd8ced095f943b9d088b49",
        measurementId: "G-JNPZSDLKV9"
    };

    if (firebase.apps.length === 0) {
        firebase.initializeApp(firebaseConfig);
    }

    // ВИКОРИСТОВУЄМО ПРЯМИЙ REST ДЛЯ GEMINI 3.5 FLASH (щоб уникнути 404 у Vertex SDK)
    window.generateAiContentWeb = async function(prompt, apiKey) {
        const url = `https://generativelanguage.googleapis.com/v1/models/gemini-3.5-flash:generateContent?key=${apiKey}`;
        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });
        const data = await response.json();
        return data.candidates[0].content.parts[0].text;
    };

    window.analyzeAiImageWeb = async function(prompt, base64Data, apiKey) {
        const url = `https://generativelanguage.googleapis.com/v1/models/gemini-3.5-flash:generateContent?key=${apiKey}`;
        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{
                    parts: [
                        { text: prompt },
                        { inline_data: { mime_type: "image/jpeg", data: base64Data } }
                    ]
                }]
            })
        });
        const data = await response.json();
        return data.candidates[0].content.parts[0].text;
    };

    window.getWebFcmToken = async function(vapidKey) {
        try {
            const messaging = firebase.messaging();
            return await messaging.getToken({ vapidKey: vapidKey });
        } catch (e) { return null; }
    };

    window.sendSmsWeb = async function(phoneNumber) {
        const auth = firebase.auth();
        auth.languageCode = 'uk';
        try {
            const recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', { 'size': 'invisible' });
            const confirmationResult = await auth.signInWithPhoneNumber(phoneNumber, recaptchaVerifier);
            window.confirmationResult = confirmationResult;
            return "SUCCESS";
        } catch (e) { throw e.message; }
    };

    window.verifySmsWeb = async function(smsCode) {
        if (!window.confirmationResult) throw "Сесія не знайдена";
        try { await window.confirmationResult.confirm(smsCode); return true; } catch (e) { throw "Невірний код"; }
    };

    window.initializeFirebaseAppCheck = function(siteKey) {
        try {
            const appCheck = firebase.appCheck();
            const provider = new firebase.appCheck.ReCaptchaEnterpriseProvider(siteKey);
            appCheck.activate(provider, true);
        } catch (e) {}
    };

    window.triggerGoogleAuth = function(clientId) {
        try {
            google.accounts.id.initialize({
                client_id: clientId,
                ux_mode: 'popup',
                auto_select: false,
                use_fedcm_for_prompt: true,
                callback: (response) => {
                    if (response.credential && window.onGoogleTokenReceived) {
                        window.onGoogleTokenReceived(response.credential);
                    }
                }
            });
            google.accounts.id.renderButton(document.getElementById("google-signin-btn"), {
                theme: "filled_blue", size: "large", width: 280, shape: "pill"
            });
            google.accounts.id.prompt();
        } catch (e) { console.error("[JS] Google Auth Error:", e); }
    };
</script>

<script src="https://accounts.google.com/gsi/client" async defer></script>

        <div id="google-signin-btn" style="display: flex; justify-content: center;"></div>
        <hr style="border: 0; border-top: 1px solid #eee; margin: 30px 0;">
        <button onclick="document.getElementById('google-auth-overlay').style.display='none'">Скасувати</button>
    </div>
</div>

</body>
</html>
