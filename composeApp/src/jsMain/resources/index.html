<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YkisMobKMP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link type="text/css" rel="stylesheet" href="styles.css">
</head>
<body style="text-align: center; align-content: center">
<!-- Инициализация Firebase App Check (reCAPTCHA) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js"></script>
<script>
    window.initializeFirebaseAppCheck = function(siteKey) {
        const checkFirebase = () => {
            if (typeof firebase !== 'undefined' && firebase.appCheck) {
                try {
                    if (!firebase.apps.length) {
                        firebase.initializeApp({
                            apiKey: "AIzaSyDZUPgZSs5RMcQFtt2DjcoZoYTi9wdI37k",
                            projectId: "ykis-mob",
                            appId: "1:1062920014188:web:cd8ced095f943b9d088b49"
                        });
                    }
                    const appCheck = firebase.appCheck();
                    // Использование ReCaptchaV3Provider
                    appCheck.activate(siteKey, true);
                    console.log("Firebase App Check bridge initialized with key:", siteKey);
                } catch (e) {
                    console.error("Critical error in App Check bridge:", e.message);
                }
            } else {
                setTimeout(checkFirebase, 100);
            }
        };
        checkFirebase();
    };
</script>

<!-- Google Identity Services -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
    window.triggerGoogleAuth = function(clientId) {
        google.accounts.id.initialize({
            client_id: clientId,
            ux_mode: 'popup',
            callback: (response) => {
                if (response.credential) {
                    console.log("Google ID Token received");
                    if (window.onGoogleTokenReceived) {
                        window.onGoogleTokenReceived(response.credential);
                    }
                }
            }
        });
        google.accounts.id.prompt();
    };
</script>

<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 50 50" role="presentation">
    <circle cx="25" cy="25" r="20" stroke="#ccc" stroke-width="4" fill="none"/>
    <circle cx="25" cy="25" r="20" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"
            stroke-dasharray="90 125">
        <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s"
                          repeatCount="indefinite"/>
    </circle>
</svg>
<script type="module" src="composeApp.js"></script>
</body>
</html>
